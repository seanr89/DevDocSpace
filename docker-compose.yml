services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: devdocspace
      POSTGRES_USER: devdocspace
      POSTGRES_PASSWORD: devdocspace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdocspace"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    profiles: [full]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=devdocspace;Username=devdocspace;Password=devdocspace
      Auth__FirebaseProjectId: ${FIREBASE_PROJECT_ID:-}
      Auth__AdminEmails__0: ${ADMIN_EMAIL:-}
      Cors__AllowedOrigins__0: http://localhost:3000
    volumes:
      - ./content:/content:ro
    ports:
      - "5080:8080"

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5080
        NEXT_PUBLIC_FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
    profiles: [full]
    depends_on: [api]
    ports:
      - "3000:3000"

volumes:
  pgdata:
